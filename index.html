<style>
:root{--bg:#0b0d17;--panel:#141828;--line:#262c45;--ink:#f3f1ea;--mute:#8d93ad;--gold:#f5c542;--ok:#3ddc84;--bad:#ff5a5f;--blue:#4d7cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{display:flex;justify-content:center;padding:24px 16px 48px}
.wrap{width:100%;max-width:560px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.logo{font-family:Archivo,sans-serif;font-weight:900;font-size:30px;letter-spacing:.02em}
.logo span{display:block;font-size:10px;font-weight:700;letter-spacing:.42em;color:var(--gold);margin-top:2px}
.date{font-size:13px;color:var(--mute)}
.bank{font-family:Archivo;font-weight:900;font-size:22px;color:var(--gold);text-align:right}
.bank small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.round{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:14px}
.topic{display:inline-block;font-size:12px;font-weight:600;color:var(--gold);border:1px solid rgba(245,197,66,.35);border-radius:99px;padding:4px 10px;margin-bottom:14px}
h1{font-family:Archivo;font-weight:900;font-size:40px;line-height:1.05;margin-bottom:12px}
h2{font-family:Archivo;font-weight:700;font-size:24px;line-height:1.25;margin-bottom:18px}
p{color:#c9cbd8;line-height:1.55;font-size:15px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transition:width .1s linear}
.timer.low i{background:var(--bad)}
.tnum{font-variant-numeric:tabular-nums}
input[type=text]{width:100%;font:600 20px Inter;color:var(--ink);background:#0e1120;border:2px solid var(--line);border-radius:12px;padding:14px 16px;outline:none}
input[type=text]:focus{border-color:var(--gold)}
.row{display:flex;gap:10px;margin-top:12px}
button{font:700 15px Inter;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;color:#111;background:var(--gold);flex:1}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.3;cursor:default}
.kbd{font-size:11px;opacity:.6;margin-left:6px;font-weight:600}
.stakes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stakes.four{grid-template-columns:repeat(4,1fr)}
.stakes button{padding:18px 0;font-family:Archivo;font-weight:900;font-size:19px}
.stakes button.used{background:#1d2238;color:#4a5072;text-decoration:line-through}
.fb{text-align:center;padding:8px 0 4px}
.fb .big{font-family:Archivo;font-weight:900;font-size:44px;margin-bottom:6px}
.fb .ok{color:var(--ok)}.fb .bad{color:var(--bad)}
.fb .ans{font-size:15px;color:var(--mute);margin-bottom:4px}
.fb .ans b{color:var(--ink)}
.fb .you{font-size:13px;color:var(--mute);margin-bottom:18px}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--gold)}
.rules{display:grid;gap:10px;margin:18px 0 22px}
.rule{display:flex;gap:12px;align-items:flex-start;background:#0e1120;border-radius:12px;padding:12px 14px}
.rule b{font-family:Archivo;color:var(--gold);font-size:18px;min-width:22px}
.rule div{font-size:14px;color:#c9cbd8;line-height:1.45}
.rule strong{color:var(--ink)}
.total{font-family:Archivo;font-weight:900;font-size:56px;color:var(--gold);line-height:1;margin:6px 0 18px}
.break{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.break div{background:#0e1120;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--mute)}
.break b{display:block;font-family:Archivo;font-size:20px;color:var(--ink);margin-top:4px}
pre{background:#0e1120;border-radius:12px;padding:14px;font:500 14px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin-bottom:10px;color:#dfe1ea}
.lb{margin-top:18px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:0 0 auto;padding:8px 14px;font-size:13px;background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.lbrow:last-child{border-bottom:0}
.lbrow .pos{width:26px;font-family:Archivo;font-weight:900;color:var(--mute)}
.lbrow .nm{flex:1}
.lbrow .sc{font-family:Archivo;font-weight:900;font-variant-numeric:tabular-nums}
.lbrow.me .nm{color:var(--gold);font-weight:700}
.lbrow:nth-child(1) .pos{color:var(--gold)}
.note{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}
.r3topics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.r3topics span{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.hide{display:none!important}
@media (max-width:420px){h1{font-size:34px}h2{font-size:21px}.stakes button{font-size:16px;padding:16px 0}}
</style>
</head>

// Čistá logika: denný výber otázok a porovnávanie odpovedí
const EPOCH = Date.UTC(2026, 10, 6); // 6. 11. 2026 = deň 0

function todayStr(d) {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Bratislava", year: "numeric", month: "2-digit", day: "2-digit" }).format(d || new Date());
  } catch (e) {
    const x = d || new Date();
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
}
function dayIndex(ds) {
  const [y, m, d] = ds.split("-").map(Number);
  return Math.max(0, Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 86400000));
}
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, seed) {
  const a = arr.slice(), r = rng(seed);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Prejde dni 0..d a vždy zoberie ďalšie otázky z premiešanej fronty; opakovanie až po vyčerpaní banky
function pickForDay(pool, perDay, distinctTopics, seed, d) {
  let cycle = 0, queue = shuffled(pool, seed), picks = [];
  for (let day = 0; day <= d; day++) {
    picks = [];
    let i = 0;
    while (picks.length < perDay) {
      if (i >= queue.length) { cycle++; queue = queue.concat(shuffled(pool, seed + cycle * 7919)); }
      const c = queue[i];
      if (!picks.includes(c) && (!distinctTopics || !picks.some(p => p[0] === c[0]))) { picks.push(c); queue.splice(i, 1); i = 0; }
      else i++;
    }
  }
  return picks;
}
function dailySet(Q, ds) {
  const d = dayIndex(ds);
  return { r1: pickForDay(Q.e, 6, false, 1001, d), r2: pickForDay(Q.m, 5, true, 2002, d), r3: pickForDay(Q.h, 4, true, 3003, d) };
}

function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function tol(len) { return len <= 3 ? 0 : len <= 6 ? 1 : 2; }
function isCorrect(input, answers, yearTol) {
  const raw = norm(input);
  if (!raw) return false;
  const alts = answers.split("|").map(norm).filter(Boolean);
  // číselné odpovede: presná zhoda číslic
  if (alts.every(a => /^[0-9 ]+$/.test(a))) {
    const digits = raw.replace(/[^0-9]/g, "");
    if (yearTol && digits) return alts.some(a => Math.abs(+a.replace(/ /g, "") - +digits) <= yearTol);
    return alts.some(a => a.replace(/ /g, "") === digits);
  }
  const words = raw.split(" ");
  const cands = new Set([raw, raw.replace(/ /g, ""), words[words.length - 1]]);
  for (const a of alts) {
    const aj = a.replace(/ /g, "");
    for (const c of cands) {
      if (c === a || c === aj) return true;
      if (c.length >= 3 && lev(c, a) <= tol(a.length)) return true;
      if (c.length >= 3 && lev(c, aj) <= tol(aj.length)) return true;
    }
  }
  return false;
}

function tolText(t) { return "Tolerancia ±" + t + " " + (t === 1 ? "rok" : t < 5 ? "roky" : "rokov"); }

}
function answerR1(val, timeout){
  if (phase !== "q") return; phase = "x";
  const q = SET.r1[r1i], ok = timeout ? false : isCorrect(val, q[2], q[3]);
  S.r1.push({ ok, a: val.slice(0, 60), skip: timeout || !val.trim() }); if (ok) S.score += R1_PTS; setBank(); save();
  r1i++;
  feedback(ok, q, val.trim(), ok ? R1_PTS : null, () => {
    if (timeout || r1left <= 0) return endR1();
    r1Question();
  });
  if (!ok) { app.querySelector(".big").textContent = "Nesprávne"; }
  if (timeout) app.querySelector(".fb").insertAdjacentHTML("afterbegin", '<p class="note" style="margin:0 0 10px">Čas na 1. kolo vypršal.</p>');
}
function endR1(){
  const good = S.r1.filter(x => x.ok).length;
  while (S.r1.length < SET.r1.length) S.r1.push({ ok: false, a: "", skip: true });
  let bonus = "";
  if (good === 6 && !S.r1bonus) { S.r1bonus = true; S.score += R1_BONUS; bonus = '<p style="color:var(--ok);font-weight:700;margin-top:6px">Bonus za 6/6: +50 €</p>'; }
  save(); setBank();
  screen('<div class="round"><span>1. kolo hotové</span></div><h1>' + good + ' / 6</h1><p>Na konte máš <b style="color:var(--gold)">' + eur(S.score) + '</b>.</p>' + bonus +
    '<div class="rules"><div class="rule"><b>2</b><div><strong>Témy</strong> – uvidíš tému a vyberieš stávku 20 / 40 / 60 / 80 / 100 €. Potom máš 10 s na odpoveď. Zle = mínus.</div></div></div>',
    "Začať 2. kolo", () => stakeRound(2));
}

// ---------- KOLO 2 a 3 ----------
let ri = 0;
function stakeRound(n){ ri = 0; if (n === 3) return r3Intro(); stakePick(n); }
function r3Intro(){
  screen('<div class="round"><span>2. kolo hotové</span></div><h1>Finále</h1><p>Na konte máš <b style="color:var(--gold)">' + eur(S.score) + '</b>. Témy finále:</p>' +
    '<div class="r3topics">' + SET.r3.map(q => "<span>" + esc(TOPICS[q[0]]) + "</span>").join("") + '</div>' +
    '<p class="note">Stávky 50 / 100 / 200 / 350 €, na odpoveď 12 s.</p>', "Začať finále", () => stakePick(3));
}
function stakePick(n){
  const set = n === 2 ? SET.r2 : SET.r3, stakes = n === 2 ? R2_STAKES : R3_STAKES, rec = n === 2 ? S.r2 : S.r3;
  if (ri >= set.length) return n === 2 ? stakeRound(3) : finish();
  const q = set[ri];
  phase = "stake";
  app.innerHTML = '<div class="card"><div class="round"><span>' + (n === 2 ? "2. kolo" : "Finále") + " · " + (ri + 1) + "/" + set.length + '</span></div><span class="topic">' + esc(TOPICS[q[0]]) + '</span><h2>Za koľko ideš?</h2>' +
    '<div class="stakes' + (stakes.length === 4 ? " four" : "") + '">' + stakes.map((s, i) => '<button data-i="' + i + '" data-s="' + s + '">' + s + "</button>").join("") + "</div>" +
    '<p class="note">Klikni alebo stlač 1 – ' + stakes.length + '. Čas na odpoveď sa spustí až po výbere.</p></div>';
  const choose = s => { if (phase !== "stake") return; phase = "x"; askStaked(n, q, s); };
  app.querySelectorAll(".stakes button").forEach(b => b.onclick = () => choose(+b.dataset.s));
}
function askStaked(n, q, stake){
  phase = "q";
  const inp = qCard((n === 2 ? "2. kolo" : "Finále") + " · stávka " + stake + " €", "", q, "");
  const done = (timeout) => {
    if (phase !== "q") return; phase = "x"; stopTimer();
    const val = inp.value, ok = timeout ? false : isCorrect(val, q[2], q[3]);
    (n === 2 ? S.r2 : S.r3).push({ ok, stake, a: val.slice(0, 60) });
    S.score += ok ? stake : -stake; setBank(); save();
    ri++;
    feedback(ok, q, val.trim(), stake, () => stakePick(n));
    if (timeout) app.querySelector(".fb").insertAdjacentHTML("afterbegin", '<p class="note" style="margin:0 0 10px">Čas vypršal.</p>');
  };
  runTimer(n === 2 ? R2_TIME : R3_TIME, $("tb"), $("tl"), () => done(true));
  $("f").onsubmit = e => { e.preventDefault(); done(false); };
}

// ---------- VÝSLEDOK ----------
function shareText(){
  const r1 = S.r1.map(x => x.ok ? "🟩" : x.skip ? "⬜" : "🟥").join("");
  const r2 = S.r2.map(x => sgn(x.ok ? x.stake : -x.stake)).join(" ");
  const r3 = S.r3.map(x => sgn(x.ok ? x.stake : -x.stake)).join(" ");
  return "DUEL · " + fmtDate(TODAY).replace(/ \d{4}$/, "") + (NAME ? "\n👤 " + NAME : "") + "\n💰 " + eur(S.score) + "\n1️⃣ " + r1 + (S.r1bonus ? " +50" : "") + "\n2️⃣ " + (r2 || "–") + "\n3️⃣ " + (r3 || "–");
}
function finish(){ S.status = "done"; save(); submitScore(); results(); }
function results(){
  stopTimer(); phase = "done"; showBank(false); onEnter = null;
  const r1 = S.r1.filter(x => x.ok).length * R1_PTS + (S.r1bonus ? R1_BONUS : 0);
  const r2 = S.r2.reduce((a, x) => a + (x.ok ? x.stake : -x.stake), 0);
  const r3 = S.r3.reduce((a, x) => a + (x.ok ? x.stake : -x.stake), 0);
  app.innerHTML = '<div class="card"><div class="round"><span>Dnešný výsledok</span><span>' + fmtDate(TODAY) + '</span></div>' +
    '<div class="total tnum">' + eur(S.score) + '</div>' +
    '<div class="break"><div>1. kolo<b>' + eur(r1) + '</b></div><div>2. kolo<b>' + eur(r2) + '</b></div><div>Finále<b>' + eur(r3) + '</b></div></div>' +
    (S.interrupted ? '<p class="note" style="margin-bottom:12px">Hra bola prerušená, počíta sa skóre v momente prerušenia.</p>' : "") +
    '<pre id="share"></pre><div class="row"><button id="cp">Kopírovať výsledok</button></div>' +
    '<p class="note">Nové otázky budú o polnoci.</p></div>';
  $("share").textContent = shareText();
  $("cp").onclick = async () => { try { await navigator.clipboard.writeText(shareText()); $("cp").textContent = "Skopírované ✓"; } catch (e) { const r = document.createRange(); r.selectNodeContents($("share")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("cp").textContent = "Označené – skopíruj ručne"; } };
}

// ---------- REBRÍČEK (Supabase) ----------
let lbRows = [], lbTab = "day", lbOk = false;
const PID = (() => { try { let p = localStorage.getItem("duel_pid"); if (!p) { p = (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); })); localStorage.setItem("duel_pid", p); } return p; } catch (e) { return null; } })();
const SB_ON = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
const sbHeaders = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { lbTab = b.dataset.t; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); renderLb(); });
function lbMsg(t){ $("lbbody").innerHTML = '<p class="note">' + t + "</p>"; }
async function fetchLb(){
  if (!SB_ON) { lbMsg("Rebríček ešte nie je nastavený (chýba Supabase URL a kľúč)."); return; }
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/scores?select=player_id,name,score,day,share&order=day.desc&limit=10000", { headers: sbHeaders });
    if (!r.ok) throw new Error(r.status);
    lbRows = await r.json(); lbOk = true;
    const mine = lbRows.find(x => x.player_id === PID && x.day === TODAY);
    if (mine && S.status === "new" && phase !== "q" && phase !== "fb" && phase !== "stake") {
      S = { status: "done", score: mine.score, r1: [], r2: [], r3: [], remote: mine.share || "" }; save();
      resultsRemote({ score: mine.score, share: mine.share });
    }
    renderLb();
  } catch (e) { lbMsg("Rebríček sa nepodarilo načítať."); }
}
function renderLb(){
  if (!lbOk) return;
  let rows;
  if (lbTab === "day") {
    rows = lbRows.filter(x => x.day === TODAY).map(x => ({ id: x.player_id, name: x.name, v: x.score, sub: "" }));
  } else {
    const m = {};
    lbRows.forEach(x => { const a = m[x.player_id] || (m[x.player_id] = { id: x.player_id, name: x.name, v: 0, n: 0 }); a.v += x.score; a.n++; });
    rows = Object.values(m).map(a => ({ ...a, sub: a.n + (a.n === 1 ? " hra" : a.n < 5 ? " hry" : " hier") }));
  }
  rows.sort((a, b) => b.v - a.v);
  if (!rows.length) return lbMsg(lbTab === "day" ? "Dnes ešte nikto nehral. Buď prvý." : "Zatiaľ žiadne výsledky.");
  const box = document.createElement("div");
  rows.forEach((r, i) => {
    const el = document.createElement("div"); el.className = "lbrow" + (r.id === PID ? " me" : "");
    const pos = document.createElement("span"); pos.className = "pos"; pos.textContent = i + 1;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = (r.name || "Hráč") + (r.id === PID ? " (ty)" : "");
    if (r.sub) { const s = document.createElement("span"); s.style.cssText = "color:var(--mute);font-size:12px;margin-left:8px"; s.textContent = r.sub; nm.appendChild(s); }
    const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = eur(r.v);
    el.append(pos, nm, sc); box.appendChild(el);
  });
  $("lbbody").replaceChildren(box);
}
async function submitScore(){
  if (!SB_ON || !PID || S.status !== "done" || S.remote || S.sent) return;
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/scores", { method: "POST", headers: { ...sbHeaders, Prefer: "return=minimal" },
      body: JSON.stringify({ day: TODAY, player_id: PID, name: NAME || "Hráč", score: S.score, share: shareText() }) });
    if (r.ok || r.status === 409) { S.sent = true; save(); }
    else $("lbstatus").textContent = "výsledok sa neuložil";
  } catch (e) { $("lbstatus").textContent = "výsledok sa neuložil"; }
  fetchLb();
}
function resultsRemote(d){
  stopTimer(); phase = "done"; showBank(false); onEnter = null;
  app.innerHTML = '<div class="card"><div class="round"><span>Dnešný výsledok</span><span>' + fmtDate(TODAY) + '</span></div><div class="total tnum">' + eur(d.score) + '</div><pre id="share"></pre><div class="row"><button id="cp">Kopírovať výsledok</button></div><p class="note">Dnes si už hral. Nové otázky budú o polnoci.</p></div>';
  $("share").textContent = d.share || "";
  $("cp").onclick = async () => { try { await navigator.clipboard.writeText(d.share || ""); $("cp").textContent = "Skopírované ✓"; } catch (e) { $("cp").textContent = "Skopíruj ručne"; } };
}

if (S.status === "done" && S.remote) resultsRemote({ score: S.score, share: S.remote }); else intro();
fetchLb();
if (S.status === "done") submitScore();
setInterval(() => { if (phase === "done" || phase === "screen" || phase === "name") fetchLb(); }, 60000);
})();
</script>
